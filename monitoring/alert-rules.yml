groups:
  - name: mock-production
    interval: 5s
    rules:
      - alert: PaymentDependencyTimeouts
        expr: |
          (
            sum(rate(mock_payment_dependency_requests_total{status="504"}[30s]))
            /
            clamp_min(
              sum(rate(mock_payment_dependency_requests_total[30s])),
              0.001
            )
          ) > 0.2
        for: 10s
        labels:
          severity: critical
          demo_scenario: payment_timeout
        annotations:
          summary: "Payment dependency is timing out"
          description: "More than 20% of simulated payment dependency requests are returning 504 responses."

      - alert: DeploymentRegression
        expr: |
          (
            sum(rate(mock_http_requests_total{
              path="/api/orders",
              status=~"5..",
              release="release-regression"
            }[30s]))
            /
            clamp_min(
              sum(rate(mock_http_requests_total{
                path="/api/orders",
                release="release-regression"
              }[30s])),
              0.001
            )
          ) > 0.3
        for: 30s
        labels:
          severity: critical
          demo_scenario: deployment_regression
        annotations:
          summary: "Elevated errors following simulated deployment"
          description: "More than 30% of /api/orders requests for the regression release are returning HTTP 5xx responses."